<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>N5 Challenge – New game</title>
  <link rel="icon" href="/img/ninja.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="hero">
    <img class="ninja" src="/img/ninja.svg" alt="">
    <div class="bubble">Set up a new N5 vocabulary challenge!</div>
  </header>

  <main>
    <form id="create-form" class="panel">
      <label class="field">
        <span>Your name</span>
        <input id="name" name="name" maxlength="20" required autocomplete="nickname">
      </label>

      <fieldset class="field">
        <legend>Number of words</legend>
        <div id="word-counts" class="segmented"></div>
        <small class="hint">How many words each player answers. Everyone gets the same words.</small>
      </fieldset>

      <details class="field collapsible">
        <summary>Options</summary>
        <div class="options">
          <label class="option">
            <span class="option-text">
              <strong>Speed bonus</strong>
              <small>Correct answers earn up to +100 extra points the faster they come. Off: only correctness counts.</small>
            </span>
            <input type="checkbox" role="switch" class="switch" id="speed-scoring" checked>
          </label>
          <div class="option-group">
            <label class="option">
              <span class="option-text">
                <strong>Answer feedback</strong>
                <small>After each click the answer flashes green (right) or red (wrong). Off: players find out only at the end.</small>
              </span>
              <input type="checkbox" role="switch" class="switch" id="color-feedback" checked>
            </label>
            <div id="feedback-extra" class="option-extra stacked">
              <label class="option sub">
                <span class="option-text">
                  <strong>Show the correct answer</strong>
                  <small>If an answer is wrong or time runs out, the right one lights up in green.</small>
                </span>
                <input type="checkbox" role="switch" class="switch" id="reveal-correct" checked>
              </label>
              <label class="option sub">
                <span class="option-text">
                  <strong>Pause longer after a mistake</strong>
                  <small>Wrong answers stay on screen for 1.5 s instead of 0.7 s, to read the correct one. Pauses never count toward time or score.</small>
                </span>
                <input type="checkbox" role="switch" class="switch" id="longer-pause" checked>
              </label>
            </div>
          </div>
          <label class="option">
            <span class="option-text">
              <strong>Pronunciation</strong>
              <small>Each word is read aloud. Players can still mute it on their device.</small>
            </span>
            <input type="checkbox" role="switch" class="switch" id="pronounce" checked>
          </label>
          <label class="option">
            <span class="option-text">
              <strong>Answer review</strong>
              <small>After the podium, each player can go through every word: their answer, the correct one, time and points.</small>
            </span>
            <input type="checkbox" role="switch" class="switch" id="answer-review" checked>
          </label>
          <div class="option-group">
            <label class="option">
              <span class="option-text">
                <strong>Time limit</strong>
                <small>Each word must be answered in time, or it counts as wrong.</small>
              </span>
              <input type="checkbox" role="switch" class="switch" id="timer-enabled" checked>
            </label>
            <div id="timer-row" class="option-extra" role="radiogroup" aria-label="Seconds per word">
              <div id="timer-choices" class="segmented compact"></div>
              <small class="hint">seconds per word</small>
            </div>
          </div>
        </div>
      </details>

      <p id="summary" class="summary-line"></p>
      <button type="submit" class="btn">Create game</button>
      <p id="error" class="error" hidden></p>
    </form>
  </main>

  <script type="module" src="/js/create.js"></script>
</body>
</html>
